<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>절차서 목록 - 표준 절차서 포털</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1 data-site-title>표준 절차서 포털</h1>
        <div class="sub" data-site-sub></div>
      </div>
      <span class="org" data-org></span>
    </div>
    <nav class="nav">
      <a href="index.html">공정도 홈</a>
      <a href="list.html" class="active">전체 목록</a>
    </nav>
  </header>

  <main>
    <div class="section-title">절차서 목록</div>
    <div class="filters">
      <select id="f-step"></select>
      <select id="f-type"></select>
      <input id="f-q" type="search" placeholder="검색어 입력" />
      <button id="f-reset" class="btn secondary" type="button">초기화</button>
    </div>
    <div id="result-count" class="result-count"></div>

    <table class="doc-table">
      <thead>
        <tr>
          <th>공정</th><th>절차서명</th><th>문서번호</th>
          <th>종류</th><th>개정</th><th>제·개정일</th>
        </tr>
      </thead>
      <tbody id="doc-rows"></tbody>
    </table>
  </main>

  <footer>오프라인 열람용 정적 포털 · 인터넷 연결 없이 브라우저에서 동작합니다.</footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>App.init("list");</script>

</html>
