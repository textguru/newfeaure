spring:
  application:
    name: qis-exam

  profiles:
    active: local

  datasource:
    # 기본은 Oracle을 가정하나, 로컬 개발/테스트는 H2로 대체할 수 있도록 프로필 분리
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: nqis
    password: nqis
    driver-class-name: oracle.jdbc.OracleDriver

  cache:
    jcache:
      config: classpath:ehcache.xml

  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:sqlmap/mapper/*.xml
  type-aliases-package: kr.or.nqis.qis.exam.vo,kr.or.nqis.qis.exam.dto.response
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    jdbc-type-for-null: NULL

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    kr.or.nqis.qis.exam: DEBUG
    org.mybatis: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:qis;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
